plugins {
	id 'application'
	id 'eclipse'
}


distTar.enabled=false
distZip.enabled=true

application {
	mainClass = 'kieker.tools.collector.CollectorMain'
}

sourceSets.main.resources.srcDirs = [ '../resources' ]

dependencies {
	implementation project(":common")
	implementation project(":analysis")
	implementation project(":tools")
	implementation project(":monitoring")

	implementation "com.beust:jcommander:${jcommanderVersion}"
	implementation "org.tukaani:xz:$libXzVersion"	// decompression algorithms used by the readers
	implementation "org.apache.commons:commons-compress:1.28.0"

	testImplementation project (path: ':common', configuration: 'testArchives')
//	testImplementation project (path: ':monitoring', configuration: 'testArchives')
	testImplementation project (path: ':analysis', configuration: 'testArchives')
	testImplementation project (path: ':tools', configuration: 'testArchives')

	testImplementation "org.junit.jupiter:junit-jupiter:${libJunitJupiterVersion}"
}

task uploadArchives {
	println 'collector skipped'
}

eclipse {
	classpath {
		file {
			whenMerged { classpath ->
				classpath.entries.removeAll { entry ->
					entry instanceof org.gradle.plugins.ide.eclipse.model.ProjectDependency
						&& ['/common', '/tools'].contains(entry.path)
						&& entry.entryAttributes['test']
				}
			}
		}
	}
}
