## Example configuration of the otel-transformer, passed with -c. All keys are optional.
## An unset key falls back to the standard OpenTelemetry environment variable named next to it,
## and otherwise to the default.

## The OTLP transport protocol: grpc (default) or http/protobuf.
## Fallback: OTEL_EXPORTER_OTLP_PROTOCOL
kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.ExportType=grpc

## The base URL of the OTLP endpoint. For http/protobuf, the path /v1/traces is appended.
## Defaults to http://localhost:4317 for grpc and http://localhost:4318 for http/protobuf.
## Fallback: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (used as given), OTEL_EXPORTER_OTLP_ENDPOINT
kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.ExportURL=http://localhost:4317

## The service.name used for the spans of all hosts. By default, the Kieker hostname is used.
## Fallback: OTEL_SERVICE_NAME, then service.name in the resource attributes
#kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.ServiceName=

## Additional attributes for the resource of every span, as key1=value1,key2=value2
## Fallback: OTEL_RESOURCE_ATTRIBUTES
#kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.ResourceAttributes=

## Headers sent with every export request, as key1=value1,key2=value2
## Fallback: OTEL_EXPORTER_OTLP_HEADERS
#kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.Headers=

## A namespace that is hashed into the trace IDs. Set a different value per run to keep
## unrelated logs apart whose Kieker trace IDs overlap.
#kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.TraceIdNamespace=

## The unit of the timestamps in the Kieker records, as name of a java.util.concurrent.TimeUnit.
#kieker.tools.oteltransformer.stages.OpenTelemetryExporterStage.TimeUnit=NANOSECONDS
